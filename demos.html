<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yarncrawler Demos</title>

<style>
  body {
    margin: 0;
    padding: 0;
    background: black;
    color: #0f0;
    font-family: monospace;
    text-align: center;
  }

  canvas {
    width: 100%;
    height: 60vh;
    background: #111;
    display: block;
    margin: auto;
  }

  button {
    font-size: 1.2em;
    padding: 12px 20px;
    margin: 10px;
    background: #0f0;
    border: none;
    border-radius: 6px;
    color: black;
    cursor: pointer;
  }
</style>
</head>

<body>

<h1>Yarncrawler Demos</h1>
<canvas id="sim"></canvas>
<button id="toggle">Switch Simulation</button>

<script>
const canvas = document.getElementById("sim");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight * 0.6;
}
resize();
window.addEventListener("resize", resize);

let mode = 0; // 0 = berm, 1 = RSVP
let t = 0;

// -----------------------------
// Demo 1: Berm-like blobs
// -----------------------------
function drawBerms() {
  ctx.fillStyle = "#111";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < 50; i++) {
    const x = (Math.sin(t * 0.01 + i) * 0.5 + 0.5) * canvas.width;
    const y = (Math.cos(t * 0.01 + i) * 0.5 + 0.5) * canvas.height;

    ctx.beginPath();
    ctx.arc(x, y, 10 + 5 * Math.sin(t * 0.05 + i), 0, Math.PI * 2);
    ctx.fillStyle = "#0f0";
    ctx.fill();
  }
}

// -----------------------------
// Demo 2: RSVP scalar field
// -----------------------------
function drawRSVP() {
  const img = ctx.createImageData(canvas.width, canvas.height);

  for (let i = 0; i < img.data.length; i += 4) {
    const idx = i / 4;
    const x = idx % canvas.width;
    const y = Math.floor(idx / canvas.width);

    const v = Math.floor(
      128 + 127 * Math.sin(0.01 * x + 0.02 * y + t * 0.02)
    );

    img.data[i] = 0;
    img.data[i + 1] = v;
    img.data[i + 2] = 0;
    img.data[i + 3] = 255;
  }

  ctx.putImageData(img, 0, 0);
}

// -----------------------------
// Main loop
// -----------------------------
function loop() {
  if (mode === 0) {
    drawBerms();
  } else {
    drawRSVP();
  }

  t++;
  requestAnimationFrame(loop);
}
loop();

// -----------------------------
// UI toggle
// -----------------------------
document.getElementById("toggle").onclick = () => {
  mode = 1 - mode;
};

</script>

</body>
</html>
