<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retrofuturism — Yarncrawler Gallery</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: radial-gradient(circle at top, #0a0a0a 0%, #000 100%);
      color: #bfffc2;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.02em;
    }

    img {
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    img:hover {
      transform: scale(1.05);
      filter: brightness(1.2) saturate(1.2);
    }

    .caption {
      background: rgba(10, 20, 10, 0.75);
      backdrop-filter: blur(6px);
    }
  </style>
</head>

  <script>
    const titles = [
      "Orbital Ruins",
      "Habitat Online",
      "Signal Locked",
      "Engine Idle",
      "Dual Horizon",
      "Corridor Empty",
      "Archive Open",
      "Array Silent",
      "Garden Active",
      "Signal Blooming",
      "City Vectorized",
      "Terminal Cold",
      "Echo Detected",
      "Solar Residue",
      "Cathedral Wired",
      "Data Fragment",
      "Grid Unstable",
      "Conveyor Sky",
      "Glow Persistent",
      "Interface Last"
    ];

    document.querySelectorAll('.caption').forEach((el, i) => {
      if (titles[i]) el.textContent = titles[i];
    });

    document.querySelectorAll('img').forEach((img, i) => {
      if (titles[i]) img.alt = titles[i];
    });
  </script>
